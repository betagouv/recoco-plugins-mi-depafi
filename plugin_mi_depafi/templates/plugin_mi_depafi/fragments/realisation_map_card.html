<div class="realisation-card fr-card fr-card--no-arrow fr-mb-2w">
    <div class="fr-card__body fr-p-2w">
        <h2 class="fr-h6 fr-mb-1w">
            <a :href="`/realisations/${realisation.id}/`"
            class="fr-link realisation-card__title"
            @click.prevent="htmx.ajax('GET', `/realisations/${realisation.id}/`, {target: '#realisation-modal-content', swap: 'innerHTML'})"
            x-text="realisation.resource.title"></a>
        </h2>
        <p class="fr-mb-0 realisation-card__date">
            Date de réalisation : <span x-text="new Date(realisation.updated_at).toLocaleDateString('fr-FR')"></span>
        </p>
        <template x-if="realisation.photos.length > 0">
            <div class="d-flex gap-1 flex-wrap fr-mt-1w">
                <template x-for="(photo, idx) in realisation.photos.slice(0, 4)" :key="idx">
                    <div style="width: calc(25% - 4px); aspect-ratio: 1; overflow: hidden; border-radius: 4px; flex-shrink: 0;">
                        <img :src="photo"
                            alt=""
                            style="width: 100%; height: 100%; object-fit: cover; display: block;">
                    </div>
                </template>
            </div>
        </template>
    </div>
</div>
